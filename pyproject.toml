[project]
name = "avatarforcing-mlx"
version = "0.1.0"
description = "AvatarForcing (CVPR 2026) real-time talking-head avatars on Apple Silicon: MLX flow transformer + PyTorch MPS decoder"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "John Robinson" }]
requires-python = ">=3.11,<3.13"
classifiers = ["Operating System :: MacOS", "License :: Other/Proprietary License"]
dependencies = [
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.9",
    "numpy>=1.26",
    "safetensors>=0.4",
    "omegaconf>=2.3",
    "pillow>=10",
    "av>=14",
    "huggingface-hub>=0.24,<1.0",
    "gdown>=5",
    # AvatarForcing's wav2vec2 wrapper targets transformers 4.30 (it sets
    # config.output_attentions, which newer versions reject with SDPA attention).
    # Its tokenizers<0.14 pin has no Python 3.12 wheels; wav2vec2 needs no tokenizer.
    "transformers==4.30.2",
    "regex",
    "requests",
]

[project.optional-dependencies]
crop = ["face-alignment>=1.4", "opencv-python>=4.8"]

[project.scripts]
avatarforcing-mlx = "avatarforcing_mlx.cli:main"

[dependency-groups]
# Equivalence tests compare against the original PyTorch code (third_party/AvatarForcing,
# fetched by scripts/fetch_upstream.sh), which imports these.
dev = ["pytest>=8", "timm>=1.0", "torchvision", "tqdm", "scipy"]

[tool.uv]
# transformers 4.30.2 pins tokenizers<0.14 (no py3.12 wheels); wav2vec2 doesn't use it.
override-dependencies = ["tokenizers; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatarforcing_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full sampling loop / end-to-end (minutes)"]
